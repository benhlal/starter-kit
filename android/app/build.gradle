apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // React Native plugin config (leave default unless you need overrides)
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.benh.zch"

    defaultConfig {
    applicationId "com.benh.zch"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    // Viro Dependencies (AR/VR support)
    implementation project(':gvr_common')
    implementation project(':arcore_client')
    implementation project(path: ':react_viro')
    implementation project(path: ':viro_renderer')

    // Media3
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.1.1'

    // ProtoBuf
    implementation 'com.google.protobuf.nano:protobuf-javanano:3.1.0'

    // Firebase (via BoM)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-firestore'

    // Google Maps & Location (needed for react-native-maps)
    implementation("com.google.android.gms:play-services-maps:18.2.0")
    implementation("com.google.android.gms:play-services-location:21.0.1")
    // Google Sign-In
    implementation("com.google.android.gms:play-services-auth:21.4.0")

    // JS engine
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Workaround: force older measurement libs to avoid Kotlin 2.1 metadata with AGP/Kotlin 1.8
    constraints {
        implementation('com.google.android.gms:play-services-measurement-api:22.0.1') {
            because 'Newer 23.x artifacts use Kotlin 2.1 metadata incompatible with Kotlin 1.8 in this project'
        }
        implementation('com.google.android.gms:play-services-measurement-impl:22.0.1') {
            because 'Align to Kotlin 1.8 compatible artifacts'
        }
    }
}

configurations.all { config ->
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.google.android.gms' && details.requested.name.startsWith('play-services-measurement')) {
            details.useVersion '22.0.1'
            details.because 'Keep measurement libs compatible with Kotlin 1.8 used by RN 0.73'
        }
        // Align key gms libs used by react-native-maps / google-signin to avoid class/interface mismatches
        if (details.requested.group == 'com.google.android.gms' && details.requested.name == 'play-services-auth') {
            details.useVersion '21.4.0'
            details.because 'Use a valid, published version and align across modules'
        }
        if (details.requested.group == 'com.google.android.gms' && details.requested.name == 'play-services-auth-base') {
            details.useVersion '18.0.10'
        }
        if (details.requested.group == 'com.google.android.gms' && details.requested.name == 'play-services-auth-api-phone') {
            details.useVersion '18.0.2'
        }
        if (details.requested.group == 'com.google.android.gms' && details.requested.name == 'play-services-location') {
            details.useVersion '21.0.1'
        }
        if (details.requested.group == 'com.google.android.gms' && details.requested.name == 'play-services-base') {
            details.useVersion '18.5.0'
        }
        if (details.requested.group == 'com.google.android.gms' && details.requested.name == 'play-services-basement') {
            details.useVersion '18.5.0'
        }
    }
    // Hard-force specific versions to avoid modules requesting non-existent versions (e.g., 21.0.1)
    resolutionStrategy.force(
        'com.google.android.gms:play-services-auth:21.4.0',
        'com.google.android.gms:play-services-auth-base:18.0.10',
        'com.google.android.gms:play-services-auth-api-phone:18.0.2',
        'com.google.android.gms:play-services-location:21.0.1',
        'com.google.android.gms:play-services-base:18.5.0',
        'com.google.android.gms:play-services-basement:18.5.0'
    )
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

// Ensure Firebase tasks run in correct order
afterEvaluate {
    tasks.matching { it.name.startsWith("map") }.configureEach {
        it.dependsOn "processDebugGoogleServices"
    }
}

// Apply Google Services plugin (must be in the app module)
apply plugin: "com.google.gms.google-services"
