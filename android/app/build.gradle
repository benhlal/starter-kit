apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // React Native plugin config (leave default unless you need overrides)
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.benh.zch"

    defaultConfig {
    applicationId "com.benh.zch"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    // Viro Dependencies (AR/VR support)
    implementation project(':gvr_common')
    implementation project(':arcore_client')
    implementation project(path: ':react_viro')
    implementation project(path: ':viro_renderer')

    // Media3
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.1.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.1.1'

    // ProtoBuf
    implementation 'com.google.protobuf.nano:protobuf-javanano:3.1.0'

    // Firebase (via BoM)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-firestore'

    // Google Maps & Location - compatible with Firebase while avoiding showsUserLocation issues
    implementation("com.google.android.gms:play-services-maps:18.1.0")
    implementation("com.google.android.gms:play-services-location:20.0.0")
    // Google Sign-In - compatible with Firebase Auth
    implementation("com.google.android.gms:play-services-auth:20.7.0")
    // Explicitly add Tasks to align with Firebase Auth transitive usage
    implementation("com.google.android.gms:play-services-tasks:18.1.0")

    // JS engine
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Workaround: force older measurement libs to avoid Kotlin 2.1 metadata with AGP/Kotlin 1.8
    constraints {
        implementation('com.google.android.gms:play-services-measurement-api:22.0.1') {
            because 'Newer 23.x artifacts use Kotlin 2.1 metadata incompatible with Kotlin 1.8 in this project'
        }
        implementation('com.google.android.gms:play-services-measurement-impl:22.0.1') {
            because 'Align to Kotlin 1.8 compatible artifacts'
        }
    }
}

configurations.all { config ->
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.google.android.gms' && details.requested.name.startsWith('play-services-measurement')) {
            details.useVersion '22.0.1'
            details.because 'Keep measurement libs compatible with Kotlin 1.8 used by RN 0.73'
        }
        // Comprehensive GMS alignment to prevent class/interface mismatches 
        if (details.requested.group == 'com.google.android.gms') {
            switch (details.requested.name) {
                case 'play-services-auth':
                    details.useVersion '20.7.0'
                    details.because 'Compatible with Firebase Auth 24.x'
                    break
                case 'play-services-auth-base':
                    details.useVersion '18.0.10'
                    break
                case 'play-services-auth-api-phone':
                    details.useVersion '18.0.2'
                    break
                case 'play-services-location':
                    details.useVersion '20.0.0'
                    details.because 'Compatible with Firebase while avoiding showsUserLocation crashes'
                    break
                case 'play-services-maps':
                    details.useVersion '18.1.0'  
                    break
                case 'play-services-base':
                    details.useVersion '18.5.0'
                    details.because 'Required for Preconditions.checkNotGoogleApiHandlerThread used by play-services-tasks 18.1.0'
                    break
                case 'play-services-basement':
                    details.useVersion '18.5.0'
                    details.because 'Align with play-services-base for Tasks await() implementation'
                    break
                case 'play-services-tasks':
                    details.useVersion '18.1.0'
                    details.because 'Align Tasks with Firebase Auth 24.x expectations'
                    break
            }
        }
    }
    // Hard-force all GMS versions to prevent any transitive conflicts
    resolutionStrategy.force(
        'com.google.android.gms:play-services-auth:20.7.0',
        'com.google.android.gms:play-services-auth-base:18.0.10',
        'com.google.android.gms:play-services-auth-api-phone:18.0.2',
        'com.google.android.gms:play-services-location:20.0.0',
        'com.google.android.gms:play-services-maps:18.1.0',
        'com.google.android.gms:play-services-base:18.5.0',
        'com.google.android.gms:play-services-basement:18.5.0',
        'com.google.android.gms:play-services-tasks:18.1.0'
    )
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

// Ensure Firebase tasks run in correct order
afterEvaluate {
    tasks.matching { it.name.startsWith("map") }.configureEach {
        it.dependsOn "processDebugGoogleServices"
    }
}

// Apply Google Services plugin (must be in the app module)
apply plugin: "com.google.gms.google-services"
